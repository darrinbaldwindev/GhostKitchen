name: Economics validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-channel-economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic economics tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Render sample scenarios
        run: python tools/channel_economics.py fixtures/economics/channel-scenarios.sample.json
